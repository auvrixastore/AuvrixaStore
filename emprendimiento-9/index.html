<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auvrixa Store - Tienda Exclusiva</title>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f4f6;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #111;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .user-badge {
      font-size: 0.9rem;
      color: #555;
      background: #f0f0f0;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
    }

    .cart-btn {
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      color: #111;
    }

    .cart-count {
      position: absolute;
      top: -8px;
      right: -8px;
      background-color: #e63946;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      font-weight: 700;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .product-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .product-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 1rem;
    }

    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      background-color: #111111;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: #333333;
    }

    .btn-secondary {
      background-color: #f1f1f1;
      color: #333;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-secondary:hover {
      background-color: #e2e2e2;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    .modal-card h2 {
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }

    .modal-card p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.2rem;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #111;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 40px;
    }

    .btn-toggle-eye {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 380px;
      max-width: 100%;
      height: 100%;
      background: white;
      box-shadow: -5px 0 25px rgba(0,0,0,0.15);
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #f5f5f5;
    }

    .cart-footer {
      border-top: 1px solid #eee;
      padding-top: 1rem;
      margin-top: 1rem;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Auvrixa Store</div>
    <div class="nav-actions">
      <span id="user-display" class="user-badge hidden"></span>
      <button id="btn-cart" class="cart-btn">
        <i data-lucide="shopping-bag"></i>
        <span id="cart-count" class="cart-count">0</span>
      </button>
    </div>
  </header>

  <main>
    <h2 class="section-title">Colección Exclusiva</h2>
    <div id="product-grid" class="product-grid"></div>
  </main>

  <!-- MODAL DE ACCESO SEGURO (FIREBASE AUTH) -->
  <div id="modal-login" class="modal-overlay">
    <div class="modal-card">
      <h2>🔒 Acceso Seguro</h2>
      <p>Inicia sesión o regístrate para acceder al catálogo.</p>

      <form id="form-auth">
        <div class="form-group">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" placeholder="tu@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" id="btn-toggle-password" class="btn-toggle-eye">
              <i data-lucide="eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary">Ingresar a la Tienda</button>
      </form>
    </div>
  </div>

  <!-- CARRITO DE COMPRAS -->
  <div id="cart-drawer" class="cart-drawer hidden">
    <div class="cart-header">
      <h3>Tu Carrito</h3>
      <button id="btn-close-cart" class="btn-secondary">Cerrar</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-price">$0.00</span>
      </div>
      <button id="btn-checkout" class="btn-primary">Finalizar Compra</button>
    </div>
  </div>

  <!-- SCRIPT PRINCIPAL CONECTADO A FIREBASE -->
  <script type="module" src="op.js"></script>

</body>
</html>
